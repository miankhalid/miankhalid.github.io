<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" fill="none">
  <!-- sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2b3a"/>
      <stop offset="1" stop-color="#3b5b6e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#203b2c"/>
      <stop offset="1" stop-color="#12321f"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#sky)"/>
  <!-- distant hills -->
  <ellipse cx="80" cy="205" rx="160" ry="70" fill="#2c4d40" fill-opacity="0.6"/>
  <ellipse cx="420" cy="215" rx="190" ry="80" fill="#2c4d40" fill-opacity="0.5"/>
  <!-- moon -->
  <circle cx="400" cy="58" r="26" fill="#eef5f1"/>
  <circle cx="392" cy="52" r="22" fill="#1b2b3a" opacity="0.85"/>
  <!-- ground -->
  <rect x="0" y="205" width="480" height="65" fill="url(#ground)"/>
  <path d="M0 205 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t0 0" fill="#2c4d40"/>
  <!-- runner (blocky round character) -->
  <g>
    <circle cx="140" cy="160" r="16" fill="#e8b94a"/>
    <path d="M128 176 q-12 0 -14 12 l-2 18 h20 v-14 l10 14 h14 l-12 -16 q2 -8 8 -14 z" fill="#f5a623"/>
    <path d="M152 180 l14 8 4 -14 z" fill="#f5a623"/>
    <rect x="120" y="150" width="6" height="30" rx="3" fill="#d28a12" transform="rotate(-18 123 165)"/>
  </g>
  <!-- speed lines -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M210 130 h70" stroke-width="7"/>
    <path d="M235 152 h95" stroke-width="5"/>
    <path d="M215 172 h45" stroke-width="5"/>
  </g>
  <!-- coins -->
  <circle cx="330" cy="130" r="11" fill="#e8b94a" stroke="#b98a10" stroke-width="3"/>
  <circle cx="380" cy="96" r="11" fill="#e8b94a" stroke="#b98a10" stroke-width="3"/>
  <circle cx="300" cy="150" r="9" fill="#e8b94a" stroke="#b98a10" stroke-width="3"/>
  <!-- ground decorations -->
  <rect x="70" y="222" width="22" height="8" rx="3" fill="#2c4d40"/>
  <rect x="330" y="235" width="18" height="7" rx="3" fill="#2c4d40"/>
  <text x="240" y="266" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="21" fill="#ffffff" fill-opacity="0.95" text-anchor="middle">Smash Runner</text>
</svg>