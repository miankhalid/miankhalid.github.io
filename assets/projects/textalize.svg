<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12342b"/>
      <stop offset="1" stop-color="#006a4e"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="2">
    <path d="M0 70 h480 M0 200 h480"/>
  </g>
  <!-- bar chart -->
  <g fill="#b8a4ed">
    <rect x="120" y="150" width="26" height="50" rx="4"/>
    <rect x="160" y="120" width="26" height="80" rx="4"/>
    <rect x="200" y="96" width="26" height="104" rx="4"/>
  </g>
  <g fill="#e8b94a">
    <rect x="300" y="60" width="26" height="140" rx="4"/>
    <rect x="340" y="100" width="26" height="100" rx="4"/>
  </g>
  <!-- analysis lines -->
  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round">
    <path d="M160 40 h60 v90 h40 v-70 h50"/>
  </g>
  <text x="240" y="248" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="24" fill="#ffffff" text-anchor="middle">Textalize Analyzer</text>
</svg>