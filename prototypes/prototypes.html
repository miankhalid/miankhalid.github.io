<style>
  /* ================= HUB SHELL (not part of any prototype) ================= */
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #17171c; }
  #pt-root { min-height: 100vh; }
  #pt-root section { scroll-margin-top: 96px; }
  #pt-style { display: none; }

  /* Prototype ribbon */
  #ribbon {
    position: fixed; top: 12px; left: 12px; z-index: 9998;
    font: 600 10px/1 ui-monospace, Menlo, monospace;
    letter-spacing: 1.5px; text-transform: uppercase;
    background: #000; color: #ffe14d; border: 1px solid #333;
    padding: 6px 10px; border-radius: 4px; pointer-events: none;
  }
  #pt-root { overflow-x: clip; }

  /* Floating switcher bar */
  #switcher {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 9999; display: flex; align-items: center; gap: 6px;
    background: rgba(10,10,14,.92); border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 6px 8px; box-shadow: 0 10px 34px rgba(0,0,0,.5);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font: 500 13px/1 ui-monospace, Menlo, monospace; color: #eee;
    user-select: none;
  }
  #switcher button {
    border: 0; background: transparent; color: #eee; cursor: pointer;
    font: inherit; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
  }
  #switcher button:hover { background: rgba(255,255,255,.14); }
  #sw-label { min-width: 168px; text-align: center; padding: 0 6px; letter-spacing: .4px; }
  #sw-grid { color: #ffe14d; }

  /* Variant palette overlay */
  #palette {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(8px);
    z-index: 9999; width: min(640px, calc(100vw - 32px));
    background: rgba(10,10,14,.96); border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px; padding: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.55);
    display: none; grid-template-columns: repeat(4, 1fr); gap: 8px;
    font-family: ui-monospace, Menlo, monospace;
  }
  #palette.open { display: grid; }
  #palette { max-height: min(70vh, 560px); overflow-y: auto; }
  #palette button {
    border: 1px solid rgba(255,255,255,.14); background: transparent; color: #ddd;
    border-radius: 8px; padding: 10px 6px; cursor: pointer; font: inherit;
    font-size: 11px; text-align: center; line-height: 1.5;
  }
  #palette button:hover { border-color: #ffe14d; color: #ffe14d; }
  #palette button b { display: block; color: #fff; font-size: 12px; }
  /* Mobile: let inner <nav> items wrap as direct flex items so nav never overflows */
  @media (max-width: 720px) {
    .pt-m .nav, .pt-o .nav, .pt-p .nav, .pt-q .nav, .pt-s .nav, .pt-t .nav, .pt-u .nav, .pt-v .nav { flex-wrap: wrap; row-gap: 6px; }

  }
  @media (max-width: 640px) {
    #palette { grid-template-columns: repeat(3, 1fr); }
    #sw-label { min-width: 132px; font-size: 12px; }
  }
</style>
</head>

const ICONS = {
  github: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.35.95.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.26 5.66.41.36.78 1.06.78 2.14v3.17c0 .3.21.67.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05a3.74 3.74 0 0 1 3.37-1.85c3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.55V9h3.57v11.45Z"/></svg>',

};

function navLinks(cls) {
  return NAV.map(([id, label]) => `<a class="${cls}" href="#${id}">${label}</a>`).join('');
}

function projectLinks(p, cls) {
  const items = (p.links || []).map((l) =>
    `<a class="${cls}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ${ICONS.arrow}</a>`
  ).join('');
  return items || `<span class="${cls} is-disabled">View</span>`;
}

function projectTags(p, cls) {
  return (p.tags || []).map((t) => `<span class="${cls}">${esc(t)}</span>`).join('');
}

function contactRow(cls, iconCls) {
  const c = S.contact || {};
  let out = '';
  if (c.email) out += `<a class="${cls}" href="mailto:${esc(c.email)}">${ICONS.mail}<span>${esc(c.email)}</span></a>`;
  if (c.github) out += `<a class="${cls}" href="${esc(c.github)}" target="_blank" rel="noopener">${ICONS.github}<span>github.com/miankhalid</span></a>`;
  if (c.linkedin) out += `<a class="${cls}" href="${esc(c.linkedin)}" target="_blank" rel="noopener">${ICONS.linkedin}<span>linkedin.com/in/miankhalid</span></a>`;
  return out;
}

/* =====================================================================
   VARIANTS. Each is a fully independent design language.
   ===================================================================== */

</script>

(function () {
  const root = document.getElementById('pt-root');
  const styleEl = document.getElementById('pt-style');
  const label = document.getElementById('sw-label');
  const keys = Object.keys(VARIANTS);

  function render(key) {
    const v = VARIANTS[key];
    if (!v) return;
    root.className = 'pt-' + key.toLowerCase();
    root.innerHTML = v.html();
    styleEl.textContent = v.css;
    label.textContent = key + ' · ' + v.name;
    const url = new URL(window.location);
    url.searchParams.set('v', key);
    history.replaceState(null, '', url);
    document.title = v.name + ' - Khalid Portfolio Prototype';
    window.scrollTo(0, 0);
    if (v.js) v.js(root);
  }

  function cycle(dir) {
    const i = keys.indexOf(current());
    const next = keys[(i + dir + keys.length) % keys.length];
    render(next);
  }

  function current() {
    const p = new URL(window.location).searchParams.get('v');
    return keys.includes(p) ? p : keys[0];
  }

  // Palette overlay
  const palette = document.getElementById('palette');
  palette.innerHTML = keys.map((k) =>
    `<button data-v="${k}"><b>${k}</b>${VARIANTS[k].name}</button>`
  ).join('');
  palette.querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => {
      render(b.dataset.v);
      palette.classList.remove('open');
    });
  });

  document.getElementById('sw-prev').addEventListener('click', () => cycle(-1));
  document.getElementById('sw-next').addEventListener('click', () => cycle(1));
  document.getElementById('sw-grid').addEventListener('click', () => palette.classList.toggle('open'));

  // Keyboard arrows
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (typing) return;
    if (e.key === 'ArrowLeft') { cycle(-1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { cycle(1); e.preventDefault(); }
    if (e.key === 'Escape') palette.classList.remove('open');
  });

  render(current());
})();
</script>
</body>
</html>
